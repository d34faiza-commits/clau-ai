# sudo cp deploy/nginx-clau-ai.conf /etc/nginx/sites-available/clau-ai
# sudo ln -s /etc/nginx/sites-available/clau-ai /etc/nginx/sites-enabled/
# Replace panel.example.com with your domain, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d panel.example.com
server {
    listen 80;
    server_name panel.example.com;

    # The panel has no login yet — protect it with HTTP basic auth.
    # Create the file with: sudo htpasswd -c /etc/nginx/.clau-ai-htpasswd admin
    auth_basic "clau-ai";
    auth_basic_user_file /etc/nginx/.clau-ai-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
