# sudo cp deploy/nginx-clau-ai.conf /etc/nginx/sites-available/clau-ai
# sudo ln -s /etc/nginx/sites-available/clau-ai /etc/nginx/sites-enabled/
# Replace panel.example.com with your domain, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d panel.example.com
server {
    listen 80;
    server_name panel.example.com;

    # clau-ai has its own login (npm run setup). For defence in depth you can add
    # HTTP basic auth or restrict by IP in front of it:
    #   sudo htpasswd -c /etc/nginx/.clau-ai-htpasswd admin
    # auth_basic "clau-ai";
    # auth_basic_user_file /etc/nginx/.clau-ai-htpasswd;
    # allow 203.0.113.10;  # your office/home IP
    # deny all;

    # Allow File Manager uploads (keep in sync with MAX_UPLOAD_MB)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # long-running scans, AI replies and database backups
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}
